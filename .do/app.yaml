#
# DigitalOcean App Platform Configuration
# This file configures deployment to DigitalOcean App Platform
#
name: whatsapp-management-app

services:
- name: whatsapp-api
  github:
    repo: YOUR-USERNAME/YOUR-REPO-NAME  # ⚠️ UPDATE THIS with your new GitHub repo
    branch: main  # or 'master' depending on your default branch
    deploy_on_push: true
  
  build_command: npm run build
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-s  # 512MB RAM, 0.5 vCPU
  http_port: 3001
  
  envs:
  - key: NODE_ENV
    value: production
    
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    
  - key: SESSION_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    
  - key: PORT
    value: "3001"
    
  - key: MAX_FILE_SIZE
    value: "10485760"
    
  - key: ALLOWED_FILE_TYPES
    value: "pdf,jpg,jpeg,png"
  
  # Optional: Add these if using Supabase for campaigns
  # - key: VITE_SUPABASE_URL
  #   scope: RUN_AND_BUILD_TIME
  #   type: SECRET
  #   
  # - key: VITE_SUPABASE_ANON_KEY
  #   scope: RUN_AND_BUILD_TIME
  #   type: SECRET

  health_check:
    http_path: /api/status
    initial_delay_seconds: 30
    period_seconds: 30
    timeout_seconds: 10
    failure_threshold: 3
  
  # IMPORTANT: Volume for WhatsApp session persistence
  # Uncomment this to prevent WhatsApp disconnections on redeploy
  # volumes:
  # - name: whatsapp-sessions
  #   size: 2GiB
  #   mount_path: /app/NodeBackend/.local

databases:
- name: whatsapp-db
  engine: PG
  version: "15"
  size: db-s-1vcpu-1gb
  num_nodes: 1

# Optional: Add Redis for session storage in production
# - name: whatsapp-redis
#   engine: REDIS
#   version: "7"
#   size: db-s-1vcpu-1gb

# Optional: Domain configuration
# domains:
# - domain: your-domain.com
#   type: PRIMARY
#   wildcard: false
#   certificate:
#     type: LETS_ENCRYPT