#
# DigitalOcean App Platform Configuration
# This file configures deployment to DigitalOcean App Platform
#
name: whatsapp-management-app

services:
- name: whatsapp-api
  github:
    repo: anprohealthtech-lab/whatsappnew-bulk
    branch: master
    deploy_on_push: true
  
  build_command: npm run build
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: professional-xs  # 1GB RAM, 1 vCPU — needed for Baileys
  http_port: 3001
  
  envs:
  - key: NODE_ENV
    value: production
    
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET

  - key: ANTHROPIC_API_KEY
    scope: RUN_TIME
    type: SECRET
    
  - key: NOTIFICATION_API_KEY
    scope: RUN_TIME
    type: SECRET

  - key: LEAD_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET

  # Meta WhatsApp Cloud API channel (values set in the DO dashboard)
  - key: META_APP_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: META_WEBHOOK_VERIFY_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: META_WA_ACCESS_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: META_APP_ID
    scope: RUN_TIME
  - key: META_ES_CONFIG_ID
    scope: RUN_TIME

  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_TIME
    type: SECRET

  - key: HIMS_SUPABASE_URL
    scope: RUN_TIME
    type: SECRET

  - key: HIMS_BOT_SECRET
    scope: RUN_TIME
    type: SECRET

  - key: SUPER_ADMIN_USERNAME
    scope: RUN_TIME
    type: SECRET

  - key: SUPER_ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET

  - key: VITE_SUPABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ""

  - key: VITE_SUPABASE_ANON_KEY
    scope: RUN_AND_BUILD_TIME
    value: ""
    
  # Browser origins allowed to call this API. Full origins, comma separated,
  # no trailing slash. Anything missing here fails CORS preflight.
  - key: CORS_ORIGINS
    scope: RUN_TIME
    value: "https://staff.anprohealthtech.com,https://www.dcptaskmanagmentapp.in,https://dcptaskmanagmentapp.in,https://whatsapp-automation.limsapp.in,https://anpro-whatsapp-bulk-chatbot-y5xix.ondigitalocean.app,https://localhost,http://localhost:5173"

  # Public URL of this backend, used to build media links sent to WhatsApp.
  - key: PUBLIC_BASE_URL
    scope: RUN_TIME
    value: "https://anpro-whatsapp-bulk-chatbot-y5xix.ondigitalocean.app"

  - key: PORT
    value: "3001"
    
  - key: MAX_FILE_SIZE
    value: "10485760"

  health_check:
    http_path: /api/health
    initial_delay_seconds: 45
    period_seconds: 30
    timeout_seconds: 10
    failure_threshold: 5
  
  # Auth files are stored on ephemeral filesystem (./auth/).
  # Users re-scan QR after each deploy — same as the working app.
  # If you upgrade to Professional plan, add a volume at /mnt/auth
  # and set AUTH_BASE_DIR=/mnt/auth to persist across deploys.

# NOTE: Using external DO Managed PostgreSQL — set DATABASE_URL env var directly
# Do NOT add a databases block here (it creates a NEW db and breaks the URL reference)
#     type: LETS_ENCRYPT
