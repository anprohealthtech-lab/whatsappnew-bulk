#
# DigitalOcean App Platform Configuration
# This file configures deployment to DigitalOcean App Platform
#
name: whatsapp-management-app

services:
- name: whatsapp-api
  github:
    repo: anprohealthtech-lab/whatsappnew-bulk
    branch: master
    deploy_on_push: true
  
  build_command: npm run build
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: professional-xs  # 1GB RAM, 1 vCPU — needed for Baileys
  http_port: 3001
  
  envs:
  - key: NODE_ENV
    value: production
    
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET

  - key: ANTHROPIC_API_KEY
    scope: RUN_TIME
    type: SECRET
    
  - key: NOTIFICATION_API_KEY
    scope: RUN_TIME
    type: SECRET

  - key: LEAD_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET

  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_TIME
    type: SECRET

  - key: SUPER_ADMIN_USERNAME
    scope: RUN_TIME
    type: SECRET

  - key: SUPER_ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET

  - key: VITE_SUPABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ""

  - key: VITE_SUPABASE_ANON_KEY
    scope: RUN_AND_BUILD_TIME
    value: ""
    
  - key: PORT
    value: "3001"
    
  - key: MAX_FILE_SIZE
    value: "10485760"

  health_check:
    http_path: /api/health
    initial_delay_seconds: 45
    period_seconds: 30
    timeout_seconds: 10
    failure_threshold: 5
  
  # Auth files are stored on ephemeral filesystem (./auth/).
  # Users re-scan QR after each deploy — same as the working app.
  # If you upgrade to Professional plan, add a volume at /mnt/auth
  # and set AUTH_BASE_DIR=/mnt/auth to persist across deploys.

# NOTE: Using external DO Managed PostgreSQL — set DATABASE_URL env var directly
# Do NOT add a databases block here (it creates a NEW db and breaks the URL reference)
#     type: LETS_ENCRYPT